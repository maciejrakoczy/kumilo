name: Check static release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Test code and educational data
        run: npm test
      - name: Build static release
        run: npm run build
      - name: Store release candidate (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: kumilo-static
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
